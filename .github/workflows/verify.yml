name: verify
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout this repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: daclify-frontend
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Install the required npm version
        run: npm install --global npm@11.19.0
      - name: Install the committed dependencies and vendored SDK packages
        working-directory: daclify-frontend
        run: npm ci --ignore-scripts
      - name: Verify this repository
        working-directory: daclify-frontend
        run: npm run verify
      - name: Check formatting and build
        working-directory: daclify-frontend
        run: npm run format:check && npm run build
